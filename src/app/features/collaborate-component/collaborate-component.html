<section class="collab reveal">
  <div class="collab__inner">
    <span class="collab__eyebrow">Powering Collaboration Across Media</span>
    <h2 class="collab__title">Collaborate. Elevate. Succeed.</h2>
    <p class="collab__subtitle">
      Empower advertisers, agencies, and media owners to work seamlessly.
    </p>
    <div class="div"></div>
    <!-- <app-button variant="outline">Meet the Experts</app-button> -->

    <div class="collab__cta">
  <app-button variant="outline">Meet the Experts</app-button>
</div>


    <!-- Stats bar -->
    <div class="collab__stats">
      @for (stat of stats; track stat.label) {
        <div class="collab__stat" #statEl>
          <span class="collab__stat-value">{{ stat.value }}</span>
          <span class="collab__stat-label">{{ stat.label }}</span>
        </div>
      }
    </div>

    <div class="collab__network">

      <svg class="collab__svg" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid meet">
  <ellipse cx="300" cy="300" rx="250" ry="220"
           fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <line x1="300" y1="40"  x2="145" y2="80"  stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="300" y1="40"  x2="445" y2="80"  stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="145" y1="80"  x2="75"  y2="165" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="445" y1="80"  x2="510" y2="165" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="75"  y1="165" x2="175" y2="245" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="510" y1="165" x2="385" y2="245" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="300" y1="155" x2="300" y2="40"  stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="300" y1="155" x2="145" y2="80"  stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="300" y1="155" x2="445" y2="80"  stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <circle cx="300" cy="155" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="175" cy="245" r="2" fill="rgba(255,255,255,0.15)"/>
  <circle cx="385" cy="245" r="2" fill="rgba(255,255,255,0.15)"/>
</svg>

  
  @for (member of members; track member.id; let i = $index) {
  <div class="collab__avatar"
       [ngClass]="'collab__avatar--' + i">
    <img [src]="member.avatarUrl" [alt]="member.name" />
  </div>
}

    </div>
  </div>
</section>
