<section class="demo-page">

  <div class="demo-page__glow demo-page__glow--one"></div>
  <div class="demo-page__glow demo-page__glow--two"></div>

  <div class="demo-page__content">

    <span class="demo-page__eyebrow">
      {{ demoData.eyebrow }}
    </span>

    <h1 class="demo-page__title">
      {{ demoData.titleMain }}
      <span>{{ demoData.titleHighlight }}</span>
    </h1>

    <p class="demo-page__desc">
      {{ demoData.desc }}
    </p>

    <div class="demo-page__actions">

      <button class="demo-page__btn demo-page__btn--primary">
        {{ demoData.actions.primary }}
      </button>

      <button class="demo-page__btn demo-page__btn--secondary">
        {{ demoData.actions.secondary }}
      </button>

    </div>

  </div>

</section>
