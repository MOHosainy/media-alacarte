<section class="benefits">

  <div class="benefits__container">

    <h1 class="benefits__title">
      Why Choose <span>{{ benefits.highlight }}</span>
    </h1>

    <p class="benefits__subtitle">
      {{ benefits.subtitle }}
    </p>

    <div class="benefits__grid">

      @for (item of benefits.items; track item.title) {
        <div class="benefits__card">

          <span class="benefits__icon">
            {{ item.icon }}
          </span>

          <h3>{{ item.title }}</h3>

          <p>{{ item.desc }}</p>

        </div>
      }

    </div>

  </div>

</section>
