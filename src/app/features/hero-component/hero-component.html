<section class="hero" #heroSection>
  <!-- Background glow blobs -->
  <div class="hero__blob hero__blob--1"></div>
  <div class="hero__blob hero__blob--2"></div>

  <div class="hero__content">
    <span class="hero__eyebrow">#1 Media Marketplace for Advertisers & Agencies</span>
    <div class="hero__accent-line">Bigger Impact</div>
    <h1 class="hero__title">Stronger Campaigns</h1>
    <p class="hero__subtitle">Smarter Media Buying</p>
    <div class="hero__actions">
      <app-button variant="primary">Start your journey!</app-button>
    </div>
  </div>

  <div class="hero__image-wrapper">
    <img src="fruit.jpg"
         alt="Team collaborating on media campaigns"
         class="hero__image" />
    <button class="hero__learn-more">
      <span class="icon">⊙</span> Learn More
    </button>
  </div>
</section>
